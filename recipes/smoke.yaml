name: lfm25-agentic-smoke
model: models/LFM2.5-1.2B-Instruct
datasets:
  - examples/tiny-agent.jsonl
seed: 42
dtype: bf16
device: auto
sequence_length: 512
micro_batch_size: 1
gradient_accumulation: 1
learning_rate: 0.0001
warmup_ratio: 0.05
weight_decay: 0.01
max_steps: 1
time_limit_minutes: 10
reserve_minutes: 5
save_every_minutes: 2
logging_steps: 1
eval_ratio: 0.2
max_source_rows: 100
max_training_samples: 100
agent_eval_samples: 2
agent_eval_max_new_tokens: 32
allowed_tools: [read, write, edit, bash]
filter_unknown_tools: true
packing: false
gradient_checkpointing: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
use_rslora: true
target_profile: attention
noise:
  enabled: false
  source: pi
  alpha: 5.0
  modulation: 0.35
geometry:
  enabled: false
  weight: 0.02
  layer: -1
  margin: 0.2
